name: Build TabBeagle User APK
on:
  push:
    branches: [android-user-build]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare clean User package
        run: |
          rm -rf mobile && mkdir mobile
          unzip -q tabbeagle-mobile.zip -d mobile
          cd mobile/tabbeagle-mobile
          npm install
          mkdir -p assets
          python3 - <<'PY'
          import base64,json,pathlib
          png=base64.b64decode("iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=")
          for n in ("adaptive-icon.png","icon.png","splash.png"):
              pathlib.Path("assets",n).write_bytes(png)
          p=pathlib.Path("app.json")
          d=json.loads(p.read_text())
          e=d.setdefault("expo",{})
          e["name"]="TabBeagle"
          e["slug"]="tabbeagle-user"
          a=e.setdefault("android",{})
          a["package"]="com.tabbeagle.user.preview"
          a["versionCode"]=2
          p.write_text(json.dumps(d,indent=2))
          PY
          CI=1 npx expo prebuild --platform android
      - name: Build and verify installable APK
        run: |
          cd mobile/tabbeagle-mobile/android
          chmod +x gradlew
          mkdir -p app/src/main/assets
          cd ..
          cat > metro.config.js <<'EOF'
          const { getDefaultConfig } = require('expo/metro-config');
          module.exports = getDefaultConfig(__dirname);
          EOF
          npx expo export:embed --platform android --dev false --entry-file App.tsx --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res
          cd android
          ./gradlew assembleDebug
          test -s app/src/main/assets/index.android.bundle
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/index.android.bundle'
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt" dump badging "$APK" | head -5
          cp "$APK" "$GITHUB_WORKSPACE/TabBeagle-User-Installable.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: TabBeagle-User-Installable
          path: TabBeagle-User-Installable.apk
          if-no-files-found: error
