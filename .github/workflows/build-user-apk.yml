name: Build TabBeagle User APK
on:
  push:
    branches: [android-user-build]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Expo source
        run: |
          rm -rf mobile
          mkdir mobile
          unzip -q tabbeagle-mobile.zip -d mobile
          cd mobile/tabbeagle-mobile
          npm install
          npx expo prebuild --platform android --non-interactive
      - name: Build installable debug APK
        run: |
          cd mobile/tabbeagle-mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/TabBeagle-User.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: TabBeagle-User
          path: TabBeagle-User.apk
          if-no-files-found: error
