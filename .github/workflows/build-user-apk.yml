name: Build TabBeagle Local User APK
on:
  push:
    branches: [android-user-build]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Create stable native Android local app
        run: |
          rm -rf native-app
          mkdir -p native-app/app/src/main/java/com/tabbeagle/app
          mkdir -p native-app/app/src/main/assets/offline
          mkdir -p native-app/app/src/main/res/values
          unzip -q tabbeagle-mobile.zip -d /tmp/mobile || true
          cat > native-app/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='TabBeagle'
          include ':app'
          EOF
          cat > native-app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF
          cat > native-app/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.tabbeagle.app'
            compileSdk 35
            defaultConfig {
              applicationId 'com.tabbeagle.app'
              minSdk 24
              targetSdk 35
              versionCode 1
              versionName '0.1.0'
            }
          }
          EOF
          cat > native-app/app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">TabBeagle</string></resources>
          EOF
          cat > native-app/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:theme="@style/AppTheme" android:label="TabBeagle" android:usesCleartextTraffic="false">
              <activity android:name=".MainActivity" android:screenOrientation="portrait" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > native-app/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
            <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:colorAccent">#25C5DF</item>
              <item name="android:navigationBarColor">#08182B</item>
              <item name="android:statusBarColor">#08182B</item>
              <item name="android:windowLightStatusBar">false</item>
            </style>
          </resources>
          EOF
          cat > native-app/app/src/main/java/com/tabbeagle/app/MainActivity.java <<'EOF'
          package com.tabbeagle.app;
          import android.app.*;
          import android.os.*;
          import android.webkit.*;
          import android.graphics.Color;
          public class MainActivity extends Activity {
            @Override public void onCreate(Bundle b) {
              super.onCreate(b);
              WebView w=new WebView(this);
              w.setBackgroundColor(Color.rgb(8,24,43));
              WebSettings s=w.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setAllowFileAccess(true);
              s.setAllowContentAccess(true);
              w.setWebViewClient(new WebViewClient());
              setContentView(w);
              w.loadUrl("file:///android_asset/offline/index.html");
            }
          }
          EOF
          cat > native-app/app/src/main/assets/offline/index.html <<'EOF'
          <!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <style>*{box-sizing:border-box}body{margin:0;background:#08182B;color:#fff;font-family:Arial,sans-serif}main{min-height:100vh;padding:42px 22px 32px;display:flex;flex-direction:column}.brand{font-weight:900;letter-spacing:2px;font-size:30px}.mark{color:#25C5DF}.hero{margin:auto 0}.eyebrow{color:#CAFF00;font-weight:800;font-size:13px;letter-spacing:1.5px}.hero h1{font-size:43px;line-height:1.02;margin:12px 0 18px}.hero p{color:#c9d3dc;font-size:18px;line-height:1.5}.btn{display:block;width:100%;padding:18px;border:0;border-radius:14px;background:#25C5DF;color:#08182B;font-size:18px;font-weight:900;margin-top:26px}.dash{display:none}.top{display:flex;justify-content:space-between;align-items:center}.card{background:#10263b;border:1px solid #1d3a52;border-radius:18px;padding:18px;margin-top:14px}.muted{color:#9fb0be}.money{font-size:34px;font-weight:900;margin-top:8px}.empty{text-align:center;padding:40px 18px}.secondary{background:transparent;color:#25C5DF;border:1px solid #25C5DF}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style></head>
          <body><main><section id="landing"><div class="brand">TAB<span class="mark">BEAGLE</span></div><div class="hero"><div class="eyebrow">ACCOUNTS RECEIVABLE, SIMPLIFIED</div><h1>Get paid without chasing customers.</h1><p>Your Accounts Receivable department, without hiring one.</p><button class="btn" onclick="start()">Get Started</button></div></section>
          <section id="dash" class="dash"><div class="top"><div class="brand">TAB<span class="mark">BEAGLE</span></div><b>Dashboard</b></div><div class="card"><div class="muted">Outstanding</div><div class="money">$0.00</div></div><div class="row"><div class="card"><div class="muted">Overdue</div><div class="money">$0</div></div><div class="card"><div class="muted">Promised</div><div class="money">$0</div></div></div><div class="card empty"><h2>You're all caught up — for now.</h2><p class="muted">Add your first invoice to let TabBeagle start tracking what you're owed.</p><button class="btn" onclick="alert('Add Invoice flow ready for next build')">Add First Invoice</button><button class="btn secondary" onclick="alert('Import flow ready for next build')">Import Invoices</button></div></section>
          <script>function start(){localStorage.setItem('tb_started','1');document.getElementById('landing').style.display='none';document.getElementById('dash').style.display='block'}if(localStorage.getItem('tb_started'))start()</script></main></body></html>
          EOF
      - name: Build APK with Gradle
        run: |
          cd native-app
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/TabBeagle-User-Local.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: TabBeagle-User-Local
          path: TabBeagle-User-Local.apk
          if-no-files-found: error
