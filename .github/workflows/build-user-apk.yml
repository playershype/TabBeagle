name: Build configured TabBeagle User APK
# TEST Build 5: durable M1 retry + patched tar, isolated TEST only
on:
  workflow_dispatch:
  push:
    branches:
      - codex/android-first-persistent-flow
    paths:
      - .github/workflows/build-user-apk.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    environment: tabbeagle-test
    env:
      EXPO_PUBLIC_API_URL: https://tabbeagle-api-test-test.up.railway.app
      EXPO_PUBLIC_SUPABASE_URL: https://gaileljkciseopfgwsbc.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_DoUb-moG-duKxrBAt7znpg_Gw-gjAe7
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm run check:env
      - run: npm test && npm run typecheck
      - name: Confirm tar security override before native Android build
        run: |
          npm audit --omit=dev --json > m1-audit-build5.json || true
          node - <<'NODE'
          const fs=require('node:fs');
          const a=JSON.parse(fs.readFileSync('m1-audit-build5.json','utf8'));
          if (!a.metadata?.vulnerabilities || !a.vulnerabilities) throw Error('npm audit incomplete');
          if (a.vulnerabilities.tar) throw Error('Critical vulnerable tar dependency is still present');
          console.log('M1_MOBILE_SECURITY',JSON.stringify(a.metadata.vulnerabilities));
          NODE
      - name: Generate native project and embedded preview
        run: |
          CI=1 npx expo prebuild --platform android --no-install
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Verify APK identity and embedded bundle
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          unzip -l "$APK" | grep 'assets/index.android.bundle'
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | head -5
          cp "$APK" ../TabBeagle-User-TEST-Build5.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TabBeagle-User-TEST-Build5
          path: TabBeagle-User-TEST-Build5.apk
          if-no-files-found: error
