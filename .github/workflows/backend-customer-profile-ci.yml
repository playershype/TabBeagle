name: Backend customer profile checks
on:
  workflow_dispatch:
  push:
    branches:
      - codex/android-splash-v01
    paths:
      - backend/**
      - .github/workflows/backend-customer-profile-ci.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
